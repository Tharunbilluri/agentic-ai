name: Deploy Streamlit App with Ollama Model

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest  # ⚠️ Use self-hosted or Docker for Ollama

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: 🧪 Create virtual environment & install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🧠 Install Ollama and Pull DeepSeek Model
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
        ollama pull deepseek-r1:1.5b

    - name: 📦 Upload Ollama Model as Build Artifact (for future use)
      uses: actions/upload-artifact@v4
      with:
        name: ollama-model
        path: ~/.ollama/models

    - name: 🚀 Run Streamlit App
      run: |
        source venv/bin/activate
        nohup streamlit run app.py &
